<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Churn Predictor 🎧</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #121212, #1db954);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-top: 2rem;
    }

    .card {
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .btn-spotify {
      background-color: #1db954;
      color: #fff;
      border: none;
      transition: 0.3s;
    }

    .btn-spotify:hover {
      background-color: #1ed760;
      color: #000;
    }

    footer {
      text-align: center;
      margin-top: auto;
      padding: 1rem 0;
      color: #ccc;
      font-size: 0.9rem;
    }

    #resultado {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Spotify Churn Predictor 🎧</h1>
    <p>Descubre si un usuario abandonará o seguirá escuchando Spotify</p>
  </header>

  <main class="container my-4">
    <div class="card p-4 mx-auto" style="max-width: 900px;">
      <h2 class="text-center mb-4">Ingresa los datos del usuario</h2>

      <form id="predictForm" onsubmit="event.preventDefault(); predecir();">
        <div class="mb-3">
          <label class="form-label">Modelo de predicción:</label>
          <select id="modelo" class="form-select">
            <option value="KNN">KNN</option>
            <option value="MLP">MLP</option>
            <option value="Regresión">Regresión Lineal</option>
            <option value="Todos">Comparar todos</option>
          </select>
        </div>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Género:</label>
            <select id="gender" class="form-select">
              <option value="Male">Masculino</option>
              <option value="Female">Femenino</option>
              <option value="Other">Otro</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Edad:</label>
            <input type="number" id="age" class="form-control" placeholder="Ej: 25">
          </div>

          <div class="col-md-4">
            <label class="form-label">País:</label>
            <select id="country" class="form-select">
              <option value="US">Estados Unidos</option>
              <option value="CA">Canadá</option>
              <option value="DE">Alemania</option>
              <option value="AU">Australia</option>
              <option value="FR">Francia</option>
              <option value="MX">México</option>
              <option value="BR">Brasil</option>
              <option value="AR">Argentina</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Tipo de suscripción:</label>
            <select id="subscription_type" class="form-select">
              <option value="Free">Free</option>
              <option value="Premium">Premium</option>
              <option value="Family">Family</option>
              <option value="Student">Student</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Tiempo de escucha (minutos):</label>
            <input type="number" id="listening_time" class="form-control" placeholder="Ej: 120">
          </div>

          <div class="col-md-6">
            <label class="form-label">Canciones por día:</label>
            <input type="number" id="songs_played_per_day" class="form-control" placeholder="Ej: 45">
          </div>

          <div class="col-md-6">
            <label class="form-label">Tasa de saltos (skip rate):</label>
            <input type="number" id="skip_rate" step="0.01" class="form-control" placeholder="Ej: 0.25">
          </div>

          <div class="col-md-6">
            <label class="form-label">Tipo de dispositivo:</label>
            <select id="device_type" class="form-select">
              <option value="Mobile">Móvil</option>
              <option value="Desktop">Escritorio</option>
              <option value="Web">Web</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Anuncios por semana:</label>
            <input type="number" id="ads_listened_per_week" class="form-control" placeholder="Ej: 5">
          </div>

          <div class="col-md-6">
            <label class="form-label">Modo sin conexión:</label>
            <select id="offline_listening" class="form-select">
              <option value="1">Sí</option>
              <option value="0">No</option>
            </select>
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-spotify btn-lg">Predecir</button>
        </div>
      </form>

      <div id="resultado" class="text-center mt-4"></div>
    </div>
  </main>

  <footer>
    Proyecto Ciencia de los Datos · Universidad Nacional de Colombia - Sede Manizales © 2025
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
